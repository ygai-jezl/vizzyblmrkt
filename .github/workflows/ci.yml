name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (includes tenant-isolation guardrails)
        run: npm run lint

      - name: No hosted-instance values in the code
        run: npm run check:instance

      # Our public repository only: a fork may keep its own .firebaserc or environment files.
      - name: No files that belong only in our private deployment repo
        if: github.repository == 'ygai-jezl/vizzyblmrkt'
        run: npm run check:private-paths

      - name: Agent guides match the repo (commands, paths, skills, .env.example)
        run: npm run agents:check

      - name: Unit tests (includes cross-tenant isolation tests)
        run: npm test

      - name: Build
        run: npm run build

  # The path a new contributor takes on a fresh machine: install, the doctor, then the end to
  # end smoke test on the emulators. No global Firebase CLI on purpose, so the pinned
  # firebase-tools comes through npx exactly as it does on a laptop without one.
  newcomer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Pinned firebase-tools version
        id: firebase
        run: node --input-type=module -e "import('./scripts/lib/local-env.mjs').then((m) => console.log('version=' + m.PINNED_FIREBASE_TOOLS))" >> "$GITHUB_OUTPUT"

      # The Firestore emulator download, which depends on the firebase-tools version.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ steps.firebase.outputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Doctor
        run: npm run doctor

      - name: Smoke test (builds, then runs on throwaway emulators)
        run: npm run smoke
