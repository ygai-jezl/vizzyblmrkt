# Firebase App Hosting — PRODUCTION overrides (merged over apphosting.yaml).
# Bound to the `prod` App Hosting environment.

runConfig:
  # minInstances: 1 keeps a warm instance so the public landing page meets its
  # latency target (App Hosting bills a warm instance at a lower idle rate).
  minInstances: 1
  maxInstances: 50
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: GOOGLE_CLOUD_PROJECT
    value: vizzybl-marketing-prod
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: vizzybl-marketing-prod
    availability:
      - BUILD
      - RUNTIME

  # Public Firebase web config (NOT secrets — shipped in the client bundle).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyD_DhhchXkLC5qux5o0bL4wEHusANTIGGo
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: vizzybl-marketing-prod.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  # reCAPTCHA Enterprise (score-based) — public site key + server assessment.
  - variable: RECAPTCHA_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: RECAPTCHA_PROJECT_ID
    value: vizzybl-marketing-prod
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: 6LdTVyEtAAAAAM_OltJ61kDmvsthyIUBcf5FCyrK
    availability:
      - BUILD
      - RUNTIME

  # Email hub — Agent 3 (Creative Director) via Vertex AI on the runtime SA (ADC).
  - variable: GOOGLE_GENAI_USE_VERTEXAI
    value: "true"
    availability:
      - RUNTIME
  - variable: GOOGLE_CLOUD_LOCATION
    value: us-central1
    availability:
      - RUNTIME
  - variable: EMAIL_ASSET_BUCKET
    value: vizzybl-marketing-prod-email-assets
    availability:
      - RUNTIME

  # Dashboard root agent (ADK 2.0 on Agent Runtime). Deploy the prod engine with
  # `ROOT_AGENT_PROJECT=vizzybl-marketing-prod agents/root-agent-py/deploy.sh`,
  # then uncomment + fill ROOT_AGENT_RESOURCE_ID. The runtime SA needs
  # roles/aiplatform.user to call :streamQuery.
  - variable: ROOT_AGENT_LOCATION
    value: us-central1
    availability:
      - RUNTIME
  # - variable: ROOT_AGENT_RESOURCE_ID
  #   value: "REPLACE_WITH_NUMERIC_ID"
  #   availability:
  #     - RUNTIME

  # Secrets (create via `firebase apphosting:secrets:set <name>` then uncomment):
  # - variable: MANDRILL_API_KEY        # transactional (verification + journeys)
  #   secret: mandrill-api-key
  #   availability:
  #     - RUNTIME
  # - variable: EMAIL_FROM
  #   value: Vizzybl <noreply@vizzybl.ai>
  #   availability:
  #     - RUNTIME
  # - variable: MAILCHIMP_API_KEY       # shared Marketing account
  #   secret: mailchimp-api-key
  #   availability:
  #     - RUNTIME
  # - variable: MAILCHIMP_AUDIENCE_ID
  #   secret: mailchimp-audience-id
  #   availability:
  #     - RUNTIME
  # - variable: EMAIL_WORKER_SECRET     # Cloud Scheduler → email/jobs/process
  #   secret: email-worker-secret
  #   availability:
  #     - RUNTIME
  # - variable: GEMINI_API_KEY          # Vertex AI Express / Agent Platform key
  #   secret: gemini-api-key            # (omit to use ADC + runtime SA instead)
  #   availability:
  #     - RUNTIME

  # Gemini Live voice conversation: PROD has no key yet, so override the base's
  # dev secret with an empty value → the feature stays OFF in prod and a prod
  # rollout never depends on the dev-only `gemini-live-api-key` secret. To enable
  # in prod: create the secret in the prod project (`firebase apphosting:secrets:set
  # gemini-live-api-key --project prod`) then swap this for `secret: gemini-live-api-key`.
  - variable: GEMINI_LIVE_API_KEY
    value: ""
    availability:
      - RUNTIME
