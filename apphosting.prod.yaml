# Firebase App Hosting — PRODUCTION overrides (merged over apphosting.yaml).
# Bound to the `prod` App Hosting environment.

runConfig:
  # minInstances: 1 keeps a warm instance so the public landing page meets its
  # latency target (App Hosting bills a warm instance at a lower idle rate).
  minInstances: 1
  maxInstances: 50
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: GOOGLE_CLOUD_PROJECT
    value: vizzybl-marketing-prod
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: vizzybl-marketing-prod
    availability:
      - BUILD
      - RUNTIME

  # Public Firebase web config (NOT secrets — shipped in the client bundle).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyD_DhhchXkLC5qux5o0bL4wEHusANTIGGo
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: vizzybl-marketing-prod.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  # Canonical platform host every brand's widget is served from by default
  # (shared-host routing; tenant resolved from the ?t= hint). MUST be a domain
  # registered on the reCAPTCHA key below. yougrow.ai doubles as the dogfood
  # tenant's brand domain — intentional. See src/lib/platform/origin.ts.
  - variable: NEXT_PUBLIC_PLATFORM_ORIGIN
    value: https://yougrow.ai
    availability:
      - BUILD
      - RUNTIME

  # Git OAuth redirect_uri origin (prod). MUST match the callback host registered
  # on the PROD GitHub/GitLab OAuth apps. See apphosting.yaml for rationale.
  - variable: GIT_OAUTH_ORIGIN
    value: https://yougrow.ai
    availability:
      - RUNTIME

  # reCAPTCHA Enterprise (score-based) — public site key + server assessment.
  - variable: RECAPTCHA_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: RECAPTCHA_PROJECT_ID
    value: vizzybl-marketing-prod
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: 6LdTVyEtAAAAAM_OltJ61kDmvsthyIUBcf5FCyrK
    availability:
      - BUILD
      - RUNTIME

  # Admin access allowlist (AUTHORIZATION; not secret). Server-side only.
  # Same value as the code default in src/lib/auth/allowlist.ts — made explicit
  # so the gate never depends on a silent fallback. AUTHENTICATION (verified
  # Google sign-in) is enforced separately in code (ensureAdminAccess). Keep
  # Email/Password + anonymous sign-in DISABLED on the prod Identity Platform
  # project as defense-in-depth (see docs/DECISIONS.md ADR-0003, 2026-07-05).
  - variable: ADMIN_ALLOWED_DOMAINS
    value: yougrow.ai
    availability:
      - RUNTIME

  # Firestore→BigQuery analytics (Phase 2, docs/SETUP.md §11). Dataset ids are
  # not secrets; the same-named datasets live in the PROD project. Enabled
  # 2026-06-22 after the prod extensions deployed + backfill verified (4 US + 2 EU
  # signups). When off, analytics degrades gracefully to the Firestore path.
  - variable: ANALYTICS_BQ_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_ANALYTICS_BQ_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  - variable: BQ_DATASET_US
    value: waitlist_us
    availability:
      - RUNTIME
  - variable: BQ_DATASET_EU
    value: waitlist_eu
    availability:
      - RUNTIME
  - variable: BQ_DATASET_ASIA
    value: waitlist_asia
    availability:
      - RUNTIME

  # Knowledge ingestion & RAG (see apphosting.yaml for the full notes). Keep the
  # flag "false" in prod until the prod vector index is built + the prod scraper
  # Job is deployed; flip last, after a prod smoke ingest. Embeddings use a
  # regional Vertex endpoint per residency region (no `global`); the ADK retrieval
  # route reuses CANVAS_CONTEXT_SIGNING_KEY (already set below).
  - variable: KNOWLEDGE_RAG_ENABLED
    value: "true"
    availability:
      - RUNTIME
  # The prod knowledge-scraper Cloud Run Job is deployed (infra/knowledge/setup.sh).
  - variable: KNOWLEDGE_JOB_NAME
    value: knowledge-scraper
    availability:
      - RUNTIME
  - variable: KNOWLEDGE_JOB_LOCATION
    value: us-central1
    availability:
      - RUNTIME

  # Email hub — Agent 3 (Creative Director) via Vertex AI on the runtime SA (ADC).
  - variable: GOOGLE_GENAI_USE_VERTEXAI
    value: "true"
    availability:
      - RUNTIME
  # MUST be "global": this project serves Gemini text models ONLY on the global
  # Vertex endpoint (us-central1 → 404); Imagen serves on both. The SDK routes
  # location:"global" to aiplatform.googleapis.com. See src/lib/agents/gemini.ts.
  - variable: GOOGLE_CLOUD_LOCATION
    value: global
    availability:
      - RUNTIME
  - variable: EMAIL_ASSET_BUCKET
    value: vizzybl-marketing-prod-email-assets
    availability:
      - RUNTIME

  # Optional generative-model overrides. Defaults are the single source of truth in
  # CODE — src/lib/agents/modelConfig.ts (TS app) and agents/root_agent/model_config.py
  # (ADK agents). Leaving these commented means prod uses those code defaults;
  # uncomment to pin a model in prod without a code change. The embedding model is
  # NOT here — it is pinned in src/lib/types/knowledgeBase.ts (coupled to the vector
  # index dimension; changing it is a re-embed migration, not a config flip).
  # - variable: GEMINI_TEXT_MODEL
  #   value: gemini-3.6-flash
  #   availability:
  #     - RUNTIME
  # - variable: GEMINI_IMAGE_MODEL
  #   value: imagen-4.0-generate-001
  #   availability:
  #     - RUNTIME
  # - variable: GEMINI_LIVE_MODEL
  #   value: gemini-3.1-flash-live-preview
  #   availability:
  #     - RUNTIME

  # WORM audit trail: a GCS bucket with a LOCKED retention policy where launch
  # deletions are recorded immutably. The runtime SA holds objectCreator only
  # (append, never read/overwrite/delete). Provision via infra/audit-log/setup.sh
  # BEFORE deletions run in this env; when unset the audit sink is a no-op.
  - variable: AUDIT_LOG_BUCKET
    value: vizzybl-marketing-prod-audit-log
    availability:
      - RUNTIME

  # Dashboard root agent (ADK 2.x on Agent Runtime). Re-deployed 2026-06-20 to
  # reasoningEngines/4483147061826420736 (project vizzybl-marketing-prod,
  # us-central1) under the dedicated root-agent@vizzybl-marketing-prod SA, now
  # with the campaign_ops sub-agent (email journey authoring). `adk deploy` mints
  # a NEW engine each run — the prior 5390059436788154368 is orphaned, delete it
  # once this is verified. The App Hosting runtime SA calls :streamQuery via the
  # project-level custom role `reasoningEngineInvoker` (query + get).
  # Re-deploy: `ROOT_AGENT_PROJECT=vizzybl-marketing-prod bash agents/root_agent/deploy.sh`.
  - variable: ROOT_AGENT_LOCATION
    value: us-central1
    availability:
      - RUNTIME
  - variable: ROOT_AGENT_RESOURCE_ID
    value: "4483147061826420736"
    availability:
      - RUNTIME

  # Secrets (create via `firebase apphosting:secrets:set <name>` then uncomment):
  - variable: MANDRILL_API_KEY        # transactional (verification + journeys)
    secret: mandrill-api-key
    availability:
      - RUNTIME
  # Sender must be a Mandrill-verified domain (vizzybl.ai: DKIM+SPF valid).
  # yougrow.ai is NOT yet verified — don't send from it until its DKIM is published.
  - variable: EMAIL_FROM
    value: Vizzybl <noreply@vizzybl.ai>
    availability:
      - RUNTIME
  # Mandrill engagement webhook (opens/clicks → /api/webhooks/mandrill). KEY is the
  # per-webhook signing key from the Mandrill dashboard; URL MUST match the
  # registered public URL byte-for-byte (it is part of the HMAC signature — a
  # trailing slash or www mismatch makes every event 401). Secret provisioned with
  # the full grant-access triple (see apphosting-secret-iam-triple).
  - variable: MANDRILL_WEBHOOK_KEY
    secret: mandrill-webhook-key
    availability:
      - RUNTIME
  - variable: MANDRILL_WEBHOOK_URL
    value: https://yougrow.ai/api/webhooks/mandrill
    availability:
      - RUNTIME
  # MailChimp Marketing — shared audience sync + Broadcasts. Provision the two
  # secrets BEFORE deploying this file (firebase apphosting:secrets:set + grantaccess
  # for the full IAM triple — see apphosting-secret-iam-triple). NOTE: broadcasts also
  # need the launch's subscribers synced into the audience (tag waitlist-<campaignId>);
  # since this was never live in prod, run the audience backfill after first deploy.
  - variable: MAILCHIMP_API_KEY        # shared Marketing account (us9)
    secret: mailchimp-api-key
    availability:
      - RUNTIME
  - variable: MAILCHIMP_AUDIENCE_ID
    secret: mailchimp-audience-id
    availability:
      - RUNTIME
  # Non-secret data-center prefix. Derivable from the key suffix ("…-us9"), but set
  # explicitly to match dev and remove any derive risk.
  - variable: MAILCHIMP_SERVER_PREFIX
    value: us9
    availability:
      - RUNTIME
  # MailChimp audience webhook master key (→ /api/webhooks/mailchimp). A broadcast
  # unsubscribe uses MailChimp's native *|UNSUB|*, so this webhook mirrors that
  # opt-out into our suppression store (email_suppressions) → also stops journeys,
  # keeping unsubscribe TENANT-WIDE. The webhook URL carries NO tenant ids — only
  # ?key=HMAC(this, <audience list_id>); the owning tenant is resolved from the
  # event's list_id (scales to any tenant count with no URL changes). Provision
  # BEFORE deploying this file:
  #   firebase apphosting:secrets:set mailchimp-webhook-key --project vizzybl-marketing-prod
  # then register the webhook URL in the MailChimp audience Settings → Webhooks.
  - variable: MAILCHIMP_WEBHOOK_KEY
    secret: mailchimp-webhook-key
    availability:
      - RUNTIME
  # Brands that share the ONE platform MailChimp audience (MAILCHIMP_AUDIENCE_ID).
  # A shared-audience unsubscribe can't be attributed to a single brand from the
  # event, so it's mirrored into each of these (they leave mailchimpConfig unset,
  # so they aren't found by the list_id → tenant lookup). Tenants with their OWN
  # audience resolve automatically and are NOT listed here. Comma-separated.
  - variable: MAILCHIMP_SHARED_AUDIENCE_TENANTS
    value: ten_yougrow-ai,ten_vzb
    availability:
      - RUNTIME
  # Shared secret the scheduled delivery worker (Cloud Scheduler) presents as
  # `X-Worker-Secret` to POST /api/admin/email/jobs/process; the cron then drains
  # every tenant's queue across all regions. Provision BEFORE deploying this file:
  #   infra/email-worker/setup.sh secret vizzybl-marketing-prod
  - variable: EMAIL_WORKER_SECRET
    secret: email-worker-secret
    availability:
      - RUNTIME
  # Shared secret the scheduled Distribute worker (Cloud Scheduler) presents as
  # `X-Worker-Secret` to POST /api/admin/distribute/posts/process; the cron then
  # drains every tenant's scheduled-post queue across all regions. Provision BEFORE
  # deploying this file:  infra/distribute-worker/setup.sh secret vizzybl-marketing-prod
  - variable: DISTRIBUTE_WORKER_SECRET
    secret: distribute-worker-secret
    availability:
      - RUNTIME
  # LinkedIn Company Page publishing (Community Management API — App 2). Provision with
  # infra/linkedin-cm/setup.sh secret vizzybl-marketing-prod, then grant the full secret
  # IAM triple. SOCIAL_TOKEN_ENC_KEY is the shared AES root for social tokens (provision
  # via infra/x-oauth/setup.sh if it doesn't already exist in prod). Personal-member
  # (LINKEDIN_OAUTH_*) + X (X_OAUTH_*) blocks are intentionally omitted — the send path
  # fail-softs to "not connected" for any channel whose credentials aren't configured.
  - variable: SOCIAL_TOKEN_ENC_KEY
    secret: social-token-enc-key
    availability:
      - RUNTIME
  - variable: LINKEDIN_CM_CLIENT_ID
    secret: linkedin-cm-client-id
    availability:
      - RUNTIME
  - variable: LINKEDIN_CM_CLIENT_SECRET
    secret: linkedin-cm-client-secret
    availability:
      - RUNTIME
  # Real social publishing (X/LinkedIn). ENABLED 2026-07-20 for LinkedIn Company Page
  # go-live (ten_vzb / Vizzybl.ai Page connected via the CM API). When "false" the worker
  # only manual-stamps posts (no external call); "true" publishes for real to any tenant
  # with a connected+valid social token. NOTE: X in prod stays effectively inert (no
  # X_OAUTH_* creds wired here), so this primarily activates LinkedIn Page/personal posts.
  - variable: DISTRIBUTE_SOCIAL_ENABLED
    value: "true"
    availability:
      - RUNTIME
  # Create-side social post image generation — ENABLED on prod (server route + NEXT_PUBLIC
  # control mirror). Requires Vertex image access for gemini-3.1-flash-lite-image on the prod
  # compute SA (same grant as email images); degrades to a graceful 502 if not provisioned.
  - variable: CREATE_SOCIAL_IMAGE_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_SOCIAL_IMAGE_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  # Create eBook studio — ENABLED in prod. Chapters/ToC/chat run on the proven TEXT_MODEL;
  # image gen/edit uses gemini-3.1-flash-image and degrades gracefully ("model unavailable")
  # if not reachable on the prod Vertex path, so enabling is safe.
  - variable: CREATE_EBOOK_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_EBOOK_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  # Brand Kit asset library (Content OS → Images gallery + Customise). Enabled in prod once
  # the image_assets composite indexes were deployed (firebase deploy --only
  # firestore:indexes) and READY. Customise reuses gemini-3.1-flash-image + EMAIL_ASSET_BUCKET.
  - variable: BRAND_KIT_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_BRAND_KIT_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  # Brand Kit → Logos — tenant corporate-logo library (brand_logos store + public /api/brand-logo
  # proxy) + primary logo defaults into email-layout headers. ENABLED in prod now that the
  # brand_logos composite index (tenantId ASC, createdAt DESC) is deployed on all prod DBs.
  - variable: BRAND_KIT_LOGOS_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_BRAND_KIT_LOGOS_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  # Brand Kit → Colours — Colours-card source extractors (PDF/website/AI-theme/logo palette) +
  # review tray + named palette groups. No new infra (reuses Gemini + existing brand PDF/logo
  # storage). ENABLED in prod (brand_logos index deployed for the logo source).
  - variable: BRAND_COLORS_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_BRAND_COLORS_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  # Brand Kit → Fonts — tenant-global typography (text styles + guidelines, tenant.brandTypography)
  # + custom font-file library (brand_fonts). ENABLED in prod; list pages degrade to empty until the
  # brand_fonts (tenantId ASC, createdAt DESC) composite index is deployed + READY on all prod DBs.
  - variable: BRAND_FONTS_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_BRAND_FONTS_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  # Brand Kit → Icons + Graphics — tenant-global uploaded ICON + GRAPHIC libraries (one brand_assets
  # collection, raster). ENABLED in prod; list pages degrade to empty until the brand_assets
  # (tenantId ASC, category ASC, createdAt DESC) composite index is deployed + READY on all prod DBs.
  - variable: BRAND_ASSETS_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_BRAND_ASSETS_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  # Deep reference integration — feed uploaded icons/graphics into image generation as visual
  # references (mirrors BRAND_STYLE_REFS_ENABLED). Server-only. ENABLED in prod.
  - variable: BRAND_ASSET_REFS_ENABLED
    value: "true"
    availability:
      - RUNTIME
  # Brand voice — authored tenant-global voice grounding all AI copy (Content OS + launch
  # broadcasts + Live voice) + AI-generate from the primary domain. No new infra/index required;
  # Gemini is already configured in prod. ENABLED in prod.
  - variable: BRAND_VOICE_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_BRAND_VOICE_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  # Brand-style feedback loop (RL-lite). Capture UI (👍/👎 + rating, seed upload) rides on
  # BRAND_KIT_ENABLED. LEARNING enabled now that the image_assets composite indexes
  # (tenantId, brandVote, brandRating desc, createdAt desc) and (tenantId, brandVote,
  # createdAt desc) are deployed + READY. LOOP = L1 style extraction/synthesis; REFS = L2
  # style reference images. BEST_OF_N stays OFF (N× cost; enable per hero surface only).
  - variable: BRAND_STYLE_LOOP_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: BRAND_STYLE_REFS_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: BRAND_BEST_OF_N
    value: "false"
    availability:
      - RUNTIME
  - variable: BRAND_BEST_OF_N_COUNT
    value: "2"
    availability:
      - RUNTIME
  # Signs the short-lived capability token the admin-chat proxy mints so the
  # Campaign Ops sub-agent can call back (POST /api/agent/canvas) to save a
  # journey DRAFT, scoped to the verified tenant. Keep COMMENTED until the secret
  # exists (an unresolved secret fails the rollout); while unset, agent journey
  # authoring is simply off — chat is unaffected. Provision per env with the full
  # grant-access triple (see infra notes / apphosting-secret-iam-triple), then
  # uncomment + redeploy the root agent with CANVAS_CALLBACK_URL set:
  #   firebase apphosting:secrets:set canvas-context-signing-key --project vizzybl-marketing-prod
  - variable: CANVAS_CONTEXT_SIGNING_KEY
    secret: canvas-context-signing-key
    availability:
      - RUNTIME
  # Signs the per-recipient email unsubscribe token (footer Unsubscribe / Manage
  # preferences links + the RFC 8058 one-click List-Unsubscribe header). Any long
  # random value; unforgeable + never expires. If absent in prod the footer safely
  # falls back to the Privacy Policy link (no broken unsubscribe). Provision BEFORE
  # deploying this file:
  #   firebase apphosting:secrets:set unsubscribe-signing-key --project vizzybl-marketing-prod
  - variable: UNSUBSCRIBE_SIGNING_KEY
    secret: unsubscribe-signing-key
    availability:
      - RUNTIME
  # - variable: GEMINI_API_KEY          # Vertex AI Express / Agent Platform key
  #   secret: gemini-api-key            # (omit to use ADC + runtime SA instead)
  #   availability:
  #     - RUNTIME

  # Gemini Live voice conversation (post-signup voice chat). REQUIRES a Gemini
  # *Developer-API* key ("AIza*") — NOT the Vertex/ADC path the email+image
  # generation above uses. Live ephemeral tokens (authTokens.create, v1alpha) are
  # Developer-API only, so getLiveTokenClient() in src/lib/agents/gemini.ts forces
  # vertexai:false and only enables on an "AIza*" key. The prod secret MUST exist
  # BEFORE deploying this file or the rollout fails to resolve it:
  #   firebase apphosting:secrets:set gemini-live-api-key --project vizzybl-marketing-prod
  - variable: GEMINI_LIVE_API_KEY
    secret: gemini-live-api-key
    availability:
      - RUNTIME

  # Git integrations (private-repo knowledge ingestion). The Next.js app runs the
  # OAuth flow + encrypts the per-tenant token (keyed by GIT_TOKEN_ENC_KEY); the
  # knowledge-scraper Job decrypts it at clone time (GIT_TOKEN_ENC_KEY is ALSO wired
  # onto the Job — see deploy.sh / setup.sh). All five secrets exist in the prod
  # project with the grant-access triple. The OAuth apps' callback URLs are
  # <GIT_OAUTH_ORIGIN>/api/admin/integrations/{github,gitlab}/callback.
  - variable: GIT_TOKEN_ENC_KEY
    secret: git-token-enc-key
    availability:
      - RUNTIME
  - variable: GITHUB_OAUTH_CLIENT_ID
    secret: github-oauth-client-id
    availability:
      - RUNTIME
  - variable: GITHUB_OAUTH_CLIENT_SECRET
    secret: github-oauth-client-secret
    availability:
      - RUNTIME
  - variable: GITLAB_OAUTH_CLIENT_ID
    secret: gitlab-oauth-client-id
    availability:
      - RUNTIME
  - variable: GITLAB_OAUTH_CLIENT_SECRET
    secret: gitlab-oauth-client-secret
    availability:
      - RUNTIME
