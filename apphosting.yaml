# Firebase App Hosting — BASE config (dev defaults; overridden per environment
# by apphosting.<env>.yaml, e.g. apphosting.prod.yaml).
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Dev scales to zero for $0 idle cost. Prod overrides minInstances to 1.
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: GOOGLE_CLOUD_PROJECT
    value: vizzybl-marketing-dev
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: vizzybl-marketing-dev
    availability:
      - BUILD
      - RUNTIME

  # Public Firebase web config (ships in the client bundle). The API key lives in
  # Secret Manager only to keep it out of this public repo — it is not a secret.
  # Required at BUILD time (NEXT_PUBLIC_* is inlined) for admin Google sign-in.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: firebase-web-api-key
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: vizzybl-marketing-dev.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  # reCAPTCHA Enterprise (score-based). Site key is public; the server-side
  # assessment runs via ADC. Flip RECAPTCHA_ENABLED to enforce.
  - variable: RECAPTCHA_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: RECAPTCHA_PROJECT_ID
    value: vizzybl-marketing-dev
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: 6Ld8SyEtAAAAAB1EXYkY2MKXK-BYHiL_s738O-vH
    availability:
      - BUILD
      - RUNTIME

  # Admin access allowlist (AUTHORIZATION; not secret). Server-side only.
  # Same value as the code default in src/lib/auth/allowlist.ts — made explicit
  # here so the gate never depends on a silent fallback. AUTHENTICATION (verified
  # Google sign-in) is enforced separately in code (ensureAdminAccess). Add
  # ADMIN_ALLOWED_EMAILS here for individual external accounts if needed.
  - variable: ADMIN_ALLOWED_DOMAINS
    value: yougrow.ai
    availability:
      - RUNTIME

  # Firestore→BigQuery analytics pipeline (Phase 2, docs/SETUP.md §11). Dataset
  # ids are NOT secrets. One same-region dataset per residency region; the
  # firestore-bigquery-export extension mirrors `signups` + `email_events` into
  # them, and the app writes widget impressions to a `widget_views` table there.
  # When ANALYTICS_BQ_ENABLED != "true" (or a region dataset is unset) the
  # BQ-backed breakdowns degrade gracefully to the Firestore path — so this is
  # OFF by default and only flipped on once the datasets + backfill are verified.
  - variable: ANALYTICS_BQ_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  # Public mirror of the flag so the embed widget can tree-shake the view beacon
  # to a no-op when the pipeline is off (NEXT_PUBLIC_* is inlined at BUILD).
  - variable: NEXT_PUBLIC_ANALYTICS_BQ_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  - variable: BQ_DATASET_US
    value: waitlist_us
    availability:
      - RUNTIME
  - variable: BQ_DATASET_EU
    value: waitlist_eu
    availability:
      - RUNTIME
  - variable: BQ_DATASET_ASIA
    value: waitlist_asia
    availability:
      - RUNTIME

  # ── Knowledge ingestion & RAG (docs/site/repo → vectors → grounded copy) ──────
  # Master switch for retrieval injection (Agent 3 + the ADK agents). OFF by
  # default; flip to "true" per-env once the knowledge_bases vector index is built
  # AND the scraper Cloud Run Job is deployed. When off, agents run ungrounded —
  # exactly as before this feature. Embeddings use a REGIONAL Vertex endpoint
  # (text-embedding-005 has no `global` endpoint); the model is PINNED in
  # src/lib/types/knowledgeBase.ts (NOT env-overridable — coupled to the vector
  # index dim), and the region is defaulted per residency
  # in src/lib/agents/embeddings.ts (us→us-central1, eu→europe-west4,
  # asia→asia-southeast1). The runtime SA needs roles/aiplatform.user. Ingestion
  # ALSO reuses CANVAS_CONTEXT_SIGNING_KEY (above) for the ADK retrieval route
  # /api/agent/knowledge — no new signing secret.
  - variable: KNOWLEDGE_RAG_ENABLED
    value: "false"
    availability:
      - RUNTIME
  # The scraper Cloud Run Job that /api/admin/knowledge/ingest dispatches to
  # (deployed via workers/knowledge-scraper/deploy.sh). Triggering needs the App
  # Hosting runtime SA to hold run.jobs.run + run.jobs.runWithOverrides on this Job. While unset,
  # the dispatch route records the ticket but does not trigger a worker.
  - variable: KNOWLEDGE_JOB_NAME
    value: knowledge-scraper
    availability:
      - RUNTIME
  - variable: KNOWLEDGE_JOB_LOCATION
    value: us-central1
    availability:
      - RUNTIME
  # Server-trusted origin for the git OAuth redirect_uri. MUST equal the origin
  # registered as the callback host on the GitHub/GitLab OAuth apps. Pinned here
  # (not derived from the request Host header) so a spoofed host can't redirect the
  # auth code and so custom tenant domains / apex-vs-www never mismatch the single
  # registered callback URL. prod overrides this in apphosting.prod.yaml.
  - variable: GIT_OAUTH_ORIGIN
    value: https://vizzybl-marketing-dev--vizzybl-marketing-dev.us-central1.hosted.app
    availability:
      - RUNTIME

  # Secrets live in Secret Manager, never in this file. Wire them like so once
  # created (`firebase apphosting:secrets:set <name>`):
  #
  # Transactional email. Provider precedence: Mandrill → Resend → log. REQUIRED
  # before any campaign sets usesSignupVerification=true (else verification-
  # required signups get a 503). EMAIL_FROM must be a verified sending domain.
  # Dev sends for real (lifecycle test mode only reaches allow-listed addresses:
  # the operator's own sign-in address or a verified sending domain). Create the
  # secret first — a missing secret fails the build:
  #   firebase apphosting:secrets:set mandrill-api-key --project dev
  # prod overrides both of these in apphosting.prod.yaml with its own values.
  - variable: MANDRILL_API_KEY
    secret: mandrill-api-key
    availability:
      - RUNTIME
  # Sender must be a Mandrill-verified domain (vizzybl.ai: DKIM+SPF valid).
  # yougrow.ai is NOT verified — don't send from it until its DKIM is published.
  - variable: EMAIL_FROM
    value: Vizzybl (dev) <noreply@vizzybl.ai>
    availability:
      - RUNTIME
  # - variable: RESEND_API_KEY
  #   secret: resend-api-key
  #   availability:
  #     - RUNTIME
  # - variable: EMAIL_FROM
  #   value: Vizzybl <noreply@vizzybl.ai>
  #   availability:
  #     - RUNTIME
  #
  # MailChimp Marketing — shared audience sync + broadcasts/journeys.
  # - variable: MAILCHIMP_API_KEY
  #   secret: mailchimp-api-key
  #   availability:
  #     - RUNTIME
  # - variable: MAILCHIMP_AUDIENCE_ID
  #   secret: mailchimp-audience-id
  #   availability:
  #     - RUNTIME
  # - variable: MAILCHIMP_SERVER_PREFIX   # optional — else derived from the key
  #   value: us21
  #   availability:
  #     - RUNTIME
  #
  # Email delivery worker secret (Cloud Scheduler → /api/admin/email/jobs/process).
  # - variable: EMAIL_WORKER_SECRET
  #   secret: email-worker-secret
  #   availability:
  #     - RUNTIME
  #
  # Distribute worker secret (Cloud Scheduler → /api/admin/distribute/posts/process).
  - variable: DISTRIBUTE_WORKER_SECRET
    secret: distribute-worker-secret
    availability:
      - RUNTIME
  #
  # Distribute carousel builder (Gemini slide images → private asset bucket). Flag
  # OFF by default; flip to "true" only AFTER provisioning the carousel image model
  # (GEMINI_CAROUSEL_IMAGE_MODEL / GOOGLE_CLOUD_LOCATION=global) + EMAIL_ASSET_BUCKET.
  # - variable: DISTRIBUTE_CAROUSEL_ENABLED
  #   value: "true"
  #   availability:
  #     - RUNTIME
  #
  # Create-side on-brand SOCIAL POST image generation (linkedin/x/instagram node
  # inspector → Gemini image → private workspace asset). Reuses the SAME model / bucket /
  # Vertex path as email images. Server flag gates the generate route; the NEXT_PUBLIC
  # mirror shows the inspector control (must be available at BUILD so Next inlines it).
  # ENABLED on dev for live smoke; keep OFF in prod until validated (override in prod yaml).
  - variable: CREATE_SOCIAL_IMAGE_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_SOCIAL_IMAGE_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  #
  # Brand Kit asset library (Content OS sidebar item → Images gallery + Customise). Server
  # flag gates the list/customize routes + the pages; the NEXT_PUBLIC mirror shows the
  # sidebar item (must be available at BUILD so Next inlines it). Customise reuses the
  # edit-capable gemini-3.1-flash-image (GEMINI_EBOOK_IMAGE_MODEL) + EMAIL_ASSET_BUCKET.
  # ENABLED on dev; keep OFF in prod until the image_assets index is live (override in prod).
  - variable: BRAND_KIT_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_BRAND_KIT_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  #
  # Brand Kit → Logos — the tenant's uploaded corporate-logo library + the primary-logo email
  # wiring. Server flag gates the /admin/brand-kit/logos page + routes; the NEXT_PUBLIC mirror
  # (BUILD-inlined) lights up the "Logos" tile. ENABLED on dev; keep OFF in prod until the
  # brand_logos composite index is live (prod yaml is standalone, so absence = OFF there).
  - variable: BRAND_KIT_LOGOS_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_BRAND_KIT_LOGOS_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  #
  # Brand Kit → Colours — the Colours card source extractors (PDF palette / website colours / AI
  # colour theme / logo colours) + the review tray + named palette groups in Account → Brand.
  # Server flag gates the extract/generate routes; the NEXT_PUBLIC mirror (BUILD-inlined) reveals
  # the source actions + tray + groups. No new infra (reuses Gemini + existing brand PDF/logo
  # storage). ENABLED on dev for smoke; keep OFF in prod until reviewed (override in prod yaml).
  - variable: BRAND_COLORS_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_BRAND_COLORS_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  #
  # Brand Kit → Fonts — tenant-global typography (text styles + guidelines, tenant.brandTypography)
  # + the uploaded custom font-file library (brand_fonts). Server flag gates the fonts page + its
  # routes; the NEXT_PUBLIC mirror (BUILD-inlined) lights up the "Fonts" tile. ENABLED on dev for
  # smoke; keep OFF in prod until the brand_fonts index is live (override in prod yaml).
  - variable: BRAND_FONTS_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_BRAND_FONTS_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  #
  # Brand Kit → Icons + Graphics — tenant-global uploaded ICON + GRAPHIC libraries (one brand_assets
  # collection, raster). Server flag gates both pages + their routes; the NEXT_PUBLIC mirror
  # (BUILD-inlined) lights up BOTH tiles. ENABLED on dev for smoke; keep OFF in prod until the
  # brand_assets index is live (override in prod yaml).
  - variable: BRAND_ASSETS_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_BRAND_ASSETS_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  #
  # Deep reference integration — feed the tenant's uploaded icons/graphics into image generation as
  # visual references (mirrors BRAND_STYLE_REFS_ENABLED). Server-only. ENABLED on dev for smoke;
  # keep OFF in prod until the libraries are provisioned (override in prod yaml).
  - variable: BRAND_ASSET_REFS_ENABLED
    value: "true"
    availability:
      - RUNTIME
  #
  # Brand voice — authored tenant-global voice (Summary/Do/Don't/guidelines) that grounds all
  # AI copy (Content OS + launch broadcasts + Live voice). Server flag gates the voice page +
  # route; the NEXT_PUBLIC mirror (BUILD-inlined) lights up the "Brand voice" tile in the Brand
  # Kit grid. ENABLED on dev for smoke; keep OFF in prod until reviewed (override in prod yaml).
  - variable: BRAND_VOICE_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_BRAND_VOICE_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  #
  # Brand-style feedback loop (RL-lite): operators 👍/👎 + 1–10 rate generated images (and
  # can seed with uploads); the style engine learns from what they approve. LOOP gates the
  # L1 vision-extraction + learned-style synthesis writes (needs the (tenantId, brandVote,
  # brandRating, createdAt) image_assets index). REFS attaches on-brand exemplars as STYLE
  # reference images to generation (social hybrid-switches lite→FULL when refs exist). The
  # capture UI itself rides on BRAND_KIT_ENABLED. BEST_OF_N generates N candidates and
  # auto-picks the most on-brand (expensive — OFF by default). ENABLED on dev for smoke;
  # keep OFF in prod until the new index is live (override in prod yaml).
  - variable: BRAND_STYLE_LOOP_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: BRAND_STYLE_REFS_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: BRAND_BEST_OF_N
    value: "false"
    availability:
      - RUNTIME
  - variable: BRAND_BEST_OF_N_COUNT
    value: "2"
    availability:
      - RUNTIME
  #
  # Create eBook studio (eBook hub content type: split-view ToC → chapter streaming →
  # on-brand image gen/edit → canvas hub). Server flag gates every studio route; the
  # NEXT_PUBLIC mirror shows the Scope toggle + studio (must be available at BUILD).
  # Image gen/edit uses gemini-3.1-flash-image (GEMINI_EBOOK_IMAGE_MODEL) on the same
  # Vertex path / EMAIL_ASSET_BUCKET as social images. ENABLED on dev for live smoke;
  # keep OFF in prod until the model + streaming are validated (override in prod yaml).
  - variable: CREATE_EBOOK_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_EBOOK_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  # - variable: GEMINI_EBOOK_IMAGE_MODEL   # optional — defaults to gemini-3.1-flash-image
  #   value: "gemini-3.1-flash-image"
  #   availability:
  #     - RUNTIME
  #
  # X (Twitter) OAuth 2.0 for the Distribute "Connect X" flow + publishing.
  # Provision with: infra/x-oauth/setup.sh secret <project>
  - variable: X_OAUTH_CLIENT_ID
    secret: x-oauth-client-id
    availability:
      - RUNTIME
  - variable: X_OAUTH_CLIENT_SECRET
    secret: x-oauth-client-secret
    availability:
      - RUNTIME
  - variable: SOCIAL_TOKEN_ENC_KEY
    secret: social-token-enc-key
    availability:
      - RUNTIME
  # LinkedIn OAuth 2.0 for the Distribute "Connect LinkedIn" flow + organic posting.
  # Provision with: infra/linkedin-oauth/setup.sh secret <project>
  - variable: LINKEDIN_OAUTH_CLIENT_ID
    secret: linkedin-oauth-client-id
    availability:
      - RUNTIME
  - variable: LINKEDIN_OAUTH_CLIENT_SECRET
    secret: linkedin-oauth-client-secret
    availability:
      - RUNTIME
  # LinkedIn Community Management app (App 2) — Company Page posting. SEPARATE app
  # (CM must be the only product on its app). Provision: infra/linkedin-cm/setup.sh.
  - variable: LINKEDIN_CM_CLIENT_ID
    secret: linkedin-cm-client-id
    availability:
      - RUNTIME
  - variable: LINKEDIN_CM_CLIENT_SECRET
    secret: linkedin-cm-client-secret
    availability:
      - RUNTIME
  # Enables REAL X publishing in the Distribute worker (else channel:'x' posts get a
  # manual stamp). Safe on dev where the cron is PARKED (single manual drain). Do NOT
  # enable in prod under a running cron until the claim is transactional (Phase-4 4d).
  - variable: DISTRIBUTE_SOCIAL_ENABLED
    value: "true"
    availability:
      - RUNTIME
  #
  # Mandrill engagement webhook (opens/clicks → /api/webhooks/mandrill). The KEY
  # is the per-webhook signing key from the Mandrill dashboard; the URL must be
  # the exact registered public URL (it is part of the HMAC signature). The
  # secret needs the full grant-access triple (viewer + service-agent
  # versionManager + secretAccessor), not just secretAccessor.
  # - variable: MANDRILL_WEBHOOK_KEY
  #   secret: mandrill-webhook-key
  #   availability:
  #     - RUNTIME
  # - variable: MANDRILL_WEBHOOK_URL
  #   value: https://yougrow.ai/api/webhooks/mandrill
  #   availability:
  #     - RUNTIME
  #
  # Signs the short-lived capability token the admin-chat proxy mints so Vizzy's
  # specialists (Campaign Ops, Lifecycle Ops) can call back (POST
  # /api/agent/canvas, GET /api/agent/lifecycle/*) to read context and save
  # DRAFTS. Created in dev with a random value (prod has its own, set in
  # apphosting.prod.yaml). The dev root agent is deployed with CANVAS_CALLBACK_URL
  # = the dev App Hosting origin (the default in agents/root_agent/deploy.sh).
  - variable: CANVAS_CONTEXT_SIGNING_KEY
    secret: canvas-context-signing-key
    availability:
      - RUNTIME
  #
  # Git OAuth (private-repo ingestion). Per-tenant GitHub/GitLab connections: a
  # "Connect" flow stores an OAuth token ENCRYPTED on the tenant doc (AES-256-GCM,
  # keyed by GIT_TOKEN_ENC_KEY); the knowledge-scraper Job decrypts it at clone
  # time (GIT_TOKEN_ENC_KEY is ALSO wired onto the Job — see deploy.sh / setup.sh).
  # Provision all five secrets, then uncomment. The OAuth apps' callback URLs must
  # be <origin>/api/admin/integrations/{github,gitlab}/callback. Each secret needs
  # the full grant-access triple (viewer + service-agent versionManager +
  # secretAccessor). While unset, the "Connect" buttons stay hidden and only
  # PUBLIC repos ingest.
  #   firebase apphosting:secrets:set git-token-enc-key --project <project>
  #   firebase apphosting:secrets:set github-oauth-client-id --project <project>
  #   firebase apphosting:secrets:set github-oauth-client-secret --project <project>
  #   firebase apphosting:secrets:set gitlab-oauth-client-id --project <project>
  #   firebase apphosting:secrets:set gitlab-oauth-client-secret --project <project>
  - variable: GIT_TOKEN_ENC_KEY
    secret: git-token-enc-key
    availability:
      - RUNTIME
  - variable: GITHUB_OAUTH_CLIENT_ID
    secret: github-oauth-client-id
    availability:
      - RUNTIME
  - variable: GITHUB_OAUTH_CLIENT_SECRET
    secret: github-oauth-client-secret
    availability:
      - RUNTIME
  - variable: GITLAB_OAUTH_CLIENT_ID
    secret: gitlab-oauth-client-id
    availability:
      - RUNTIME
  - variable: GITLAB_OAUTH_CLIENT_SECRET
    secret: gitlab-oauth-client-secret
    availability:
      - RUNTIME
  # Git repo selection — after connecting GitHub/GitLab the admin picks WHICH repos
  # (personal + every org/group they belong to) the connection may be used for;
  # the knowledge-scraper Job only attaches the token for selected repos. Also adds
  # GitLab's read_api scope (needed to list projects). Needs the Job redeployed
  # (workers/knowledge-scraper/deploy.sh) with the matching gitToken.ts. ON in dev for smoke.
  - variable: GIT_REPO_SELECTION_ENABLED
    value: "true"
    availability:
      - RUNTIME

  # Agent 3 (Creative Director) — Gemini on Vertex AI. By default (no key) it uses
  # the runtime service account via ADC (needs the Vertex AI API enabled + the SA
  # granted roles/aiplatform.user). Alternatively provide a Vertex AI Express /
  # Agent Platform key as the GEMINI_API_KEY secret below and the SDK switches to
  # { vertexai:true, apiKey } — the SAME key works across local/dev/prod.
  - variable: GOOGLE_GENAI_USE_VERTEXAI
    value: "true"
    availability:
      - RUNTIME
  # MUST be "global": this project serves Gemini text models ONLY on the global
  # Vertex endpoint (us-central1 → 404); Imagen serves on both. The SDK routes
  # location:"global" to aiplatform.googleapis.com. See src/lib/agents/gemini.ts.
  - variable: GOOGLE_CLOUD_LOCATION
    value: global
    availability:
      - RUNTIME
  # - variable: GEMINI_API_KEY
  #   secret: gemini-api-key
  #   availability:
  #     - RUNTIME
  #
  # Gemini Live API — post-signup voice conversation. DEVELOPER-API key ("AIza*"),
  # NOT the Vertex path above: ephemeral tokens + Live are Developer-API only.
  # Enabled for DEV here; PROD overrides this to an empty value (feature off) in
  # apphosting.prod.yaml until a prod key is provisioned, so a prod rollout never
  # depends on a secret that only exists in the dev project.
  - variable: GEMINI_LIVE_API_KEY
    secret: gemini-live-api-key
    availability:
      - RUNTIME
  # Optional generative-model overrides. Defaults live in code
  # (src/lib/agents/modelConfig.ts); uncomment to pin a model in this env with no
  # code change. The embedding model is NOT here — it is pinned in
  # src/lib/types/knowledgeBase.ts (coupled to the vector-index dimension).
  # - variable: GEMINI_TEXT_MODEL          # optional — defaults to gemini-3.6-flash
  #   value: gemini-3.6-flash
  #   availability:
  #     - RUNTIME
  # - variable: GEMINI_IMAGE_MODEL         # optional — defaults to imagen-4.0-generate-001
  #   value: imagen-4.0-generate-001
  #   availability:
  #     - RUNTIME
  # - variable: GEMINI_LIVE_MODEL          # optional — defaults to gemini-3.1-flash-live-preview
  #   value: gemini-3.1-flash-live-preview
  #   availability:
  #     - RUNTIME
  # PRIVATE GCS bucket for Agent 3's generated hero images. The org enforces
  # uniform bucket-level access + domain-restricted sharing, so objects can NOT
  # be made public — images are served via /api/email-asset/<path> by the runtime
  # compute SA, which holds objectCreator+objectViewer on this bucket.
  - variable: EMAIL_ASSET_BUCKET
    value: vizzybl-marketing-dev-email-assets
    availability:
      - RUNTIME

  # WORM audit trail: a GCS bucket with a LOCKED retention policy where launch
  # deletions are recorded immutably. The runtime SA holds objectCreator only
  # (append, never read/overwrite/delete). Provision via infra/audit-log/setup.sh
  # BEFORE deletions run in this env; when unset the audit sink is a no-op.
  - variable: AUDIT_LOG_BUCKET
    value: vizzybl-marketing-dev-audit-log
    availability:
      - RUNTIME

  # Dashboard root agent (ADK 2.0 on Agent Runtime). The proxy
  # (/api/admin/agent/chat) calls the reasoningEngine via :streamQuery using the
  # runtime SA's ADC token — grant that SA roles/aiplatform.user. ROOT_AGENT_LOCATION
  # is the engine's DEPLOY region. Uncomment + fill ROOT_AGENT_RESOURCE_ID after
  # `agents/root_agent/deploy.sh` prints the reasoningEngines/<ID> tail; until
  # then the chat streams a "not deployed yet" message.
  - variable: ROOT_AGENT_LOCATION
    value: us-central1
    availability:
      - RUNTIME
  - variable: ROOT_AGENT_RESOURCE_ID
    value: "2597757299074269184"
    availability:
      - RUNTIME
  # Mandrill engagement webhook (opens/clicks → /api/webhooks/mandrill). KEY is the
  # per-webhook signing key from the Mandrill dashboard; URL must match the
  # registered public URL byte-for-byte (it is part of the HMAC signature). NOTE:
  # dev now sends via Mandrill (MANDRILL_API_KEY above), but engagement events
  # only arrive once a dev webhook — pointing at this URL, signed by this secret
  # — is registered in the Mandrill dashboard.
  - variable: MANDRILL_WEBHOOK_KEY
    secret: mandrill-webhook-key
    availability:
      - RUNTIME
  - variable: MANDRILL_WEBHOOK_URL
    value: https://vizzybl-marketing-dev--vizzybl-marketing-dev.us-central1.hosted.app/api/webhooks/mandrill
    availability:
      - RUNTIME
  # Lifecycle journeys — connected products (Products page, sandbox, admin APIs)
  # and the public ingest API (/api/v1/events). ENABLED on dev; OFF in prod until
  # verified here and promoted (overridden in apphosting.prod.yaml).
  - variable: LIFECYCLE_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_LIFECYCLE_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  # API v2 (/api/v2/users…): the state-based product API. It replaced v1's
  # /api/v1/events, removed on 2026-09-25 with its LIFECYCLE_INGEST_ENABLED flag.
  # "false" in prod (apphosting.prod.yaml) until verified here, then turned on
  # there with a chore(prod) change.
  - variable: API_V2_ENABLED
    value: "true"
    availability:
      - RUNTIME
  # Root key that seals connection secrets (AES-GCM). Created in dev with
  #   infra/lifecycle/setup.sh secret vizzybl-marketing-dev
  - variable: CONNECT_SECRET_ENC_KEY
    secret: connect-secret-enc-key
    availability:
      - RUNTIME
  # Requests the platform sends TO products (context pulls, webhooks) carry an
  # ES256 JWT signed with this Cloud KMS key (HSM, never exported) — not the
  # connection secret. Public keys: <CONNECT_ISSUER>/.well-known/jwks.json.
  # A resource name, not a secret. Created per project with
  #   infra/lifecycle/setup.sh signing-key vizzybl-marketing-dev
  # prod overrides both in apphosting.prod.yaml.
  # Public developer docs (/developers): how to send events, build the context
  # endpoint, receive webhooks and verify our requests. Off in prod until the
  # owner opens them (apphosting.prod.yaml).
  - variable: DEVELOPERS_DOCS_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: CONNECT_SIGNING_KMS_KEY
    value: projects/vizzybl-marketing-dev/locations/us-central1/keyRings/yougrow-connect/cryptoKeys/outbound-signing
    availability:
      - RUNTIME
  - variable: CONNECT_ISSUER
    value: https://vizzybl-marketing-dev--vizzybl-marketing-dev.us-central1.hosted.app
    availability:
      - RUNTIME
  # Lifecycle runner: the highest delivery mode dev may use (prod: test), and the
