# Firebase App Hosting — BASE config (dev defaults; overridden per environment
# by apphosting.<env>.yaml, e.g. apphosting.prod.yaml).
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Dev scales to zero for $0 idle cost. Prod overrides minInstances to 1.
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: GOOGLE_CLOUD_PROJECT
    value: vizzybl-marketing-dev
    availability:
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: vizzybl-marketing-dev
    availability:
      - BUILD
      - RUNTIME

  # Public Firebase web config (NOT secrets — these ship in the client bundle).
  # Required at BUILD time (NEXT_PUBLIC_* is inlined) for admin Google sign-in.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBG9TSeva0VaH-XUuohP2XKECn4taeLNzM
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: vizzybl-marketing-dev.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  # reCAPTCHA Enterprise (score-based). Site key is public; the server-side
  # assessment runs via ADC. Flip RECAPTCHA_ENABLED to enforce.
  - variable: RECAPTCHA_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: RECAPTCHA_PROJECT_ID
    value: vizzybl-marketing-dev
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
    value: 6Ld8SyEtAAAAAB1EXYkY2MKXK-BYHiL_s738O-vH
    availability:
      - BUILD
      - RUNTIME

  # Secrets live in Secret Manager, never in this file. Wire them like so once
  # created (`firebase apphosting:secrets:set <name>`):
  #
  # - variable: RECAPTCHA_API_KEY
  #   secret: recaptcha-api-key
  #   availability:
  #     - RUNTIME
