# Firebase App Hosting: the shared base settings for every deployment of this app.
#
# This file names no deployment. It lists every feature switch the code reads, each one
# "false", and the few settings that are the same everywhere. A switch is on only when it
# is the exact string "true", so a fresh fork builds and runs with every feature off.
#
# Your own values go in apphosting.<environment>.yaml in your fork, for example
# apphosting.prod.yaml. Give the App Hosting backend that environment name (in the Firebase
# console: App Hosting, your backend, Settings, Environment) and App Hosting merges that
# file over this one at build time: an env entry there replaces the entry here with the
# same variable, and runConfig fields there replace the ones here. To turn a feature on,
# set its switch to "true" in your environment file.
#
# Secrets live in Secret Manager and are referenced by name from your environment file
# only, never from this one, so a first build never waits on a secret you haven't made.
# docs/self-host.md walks through a deployment step by step.
# https://firebase.google.com/docs/app-hosting/multiple-environments

runConfig:
  # Small and cheap to start with: scales to zero when idle and to two instances under
  # load. Raise maxInstances (and minInstances, to skip cold starts) in your environment
  # file when traffic grows.
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # ===== The same for every deployment =====

  # Gemini and embeddings run on Vertex AI as the runtime service account, so no API key
  # is needed. The service account needs roles/aiplatform.user.
  - variable: GOOGLE_GENAI_USE_VERTEXAI
    value: "true"
    availability:
      - RUNTIME
  # Gemini text models are served on the global Vertex AI endpoint.
  - variable: GOOGLE_CLOUD_LOCATION
    value: global
    availability:
      - RUNTIME

  # ===== What your environment file sets =====
  # Nothing below is set here, because each value names one deployment. Put the ones you
  # need in apphosting.<environment>.yaml, shaped like this:
  #
  #   - variable: GOOGLE_CLOUD_PROJECT
  #     value: my-project
  #     availability:
  #       - RUNTIME
  #   - variable: MANDRILL_API_KEY
  #     secret: mandrill-api-key
  #     availability:
  #       - RUNTIME
  #
  # NEXT_PUBLIC_* variables are built into the page, so give them BUILD and RUNTIME.
  # .env.example says what every variable does; docs/self-host.md says which you need.
  #
  #   Project and sign-in
  #     GOOGLE_CLOUD_PROJECT, NEXT_PUBLIC_FIREBASE_PROJECT_ID      my-project
  #     NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN                            my-project.firebaseapp.com
  #     NEXT_PUBLIC_FIREBASE_API_KEY                                secret (public web key)
  #     ADMIN_ALLOWED_DOMAINS or ADMIN_ALLOWED_EMAILS               example.com
  #     ADMIN_BOOTSTRAP_TENANT_ID, ADMIN_BOOTSTRAP_REGION           ten_example, us
  #     NEXT_PUBLIC_ADMIN_HD, NEXT_PUBLIC_ADMIN_SIGNIN_DOMAIN       example.com
  #     RECAPTCHA_PROJECT_ID, NEXT_PUBLIC_RECAPTCHA_SITE_KEY        with RECAPTCHA_ENABLED
  #   Addresses
  #     NEXT_PUBLIC_PLATFORM_ORIGIN, NEXT_PUBLIC_SITE_ORIGIN        https://app.example.com
  #     EMAIL_LINK_ORIGIN, CONNECT_ISSUER, GIT_OAUTH_ORIGIN         https://app.example.com
  #     SITE_WAITLIST_CAMPAIGN                                      a campaign slug
  #   Email
  #     EMAIL_FROM                                                  Example <noreply@example.com>
  #     EMAIL_DEFAULT_PRIVACY_URL                                   https://example.com/privacy
  #     MANDRILL_API_KEY, MANDRILL_WEBHOOK_KEY                      secrets
  #     MANDRILL_WEBHOOK_URL                                        https://app.example.com/api/webhooks/mandrill
  #   Storage, keys and workers
  #     EMAIL_ASSET_BUCKET, AUDIT_LOG_BUCKET                        my-project-email-assets
  #     CONNECT_SIGNING_KMS_KEY                                     projects/.../cryptoKeys/...
  #     CONNECT_SECRET_ENC_KEY, UNSUBSCRIBE_SIGNING_KEY             secrets
  #     INVITE_LINK_SIGNING_KEY, CANVAS_CONTEXT_SIGNING_KEY         secrets
  #     LIFECYCLE_WORKER_SECRET, EMAIL_WORKER_SECRET                secrets
  #     DISTRIBUTE_WORKER_SECRET                                    secret
  #     LIFECYCLE_MODE_CEILING                                      test, shadow or live (unset: test)
  #     KNOWLEDGE_JOB_NAME, KNOWLEDGE_JOB_LOCATION                  knowledge-scraper, us-central1
  #     ROOT_AGENT_RESOURCE_ID, ROOT_AGENT_LOCATION                 your agent engine, us-central1
  #   Connections
  #     GITHUB_APP_ID, GITHUB_APP_SLUG, GITHUB_APP_CLIENT_ID        your read only GitHub App
  #     GITHUB_APP_CLIENT_SECRET, GITHUB_APP_PRIVATE_KEY            secrets
  #     GIT_TOKEN_ENC_KEY, SOCIAL_TOKEN_ENC_KEY                     secrets
  #     X_OAUTH_*, LINKEDIN_OAUTH_*, LINKEDIN_CM_*                  secrets
  #     MAILCHIMP_*                                                 secrets and settings
  #   Analytics and the voice chat
  #     NEXT_PUBLIC_GA_MEASUREMENT_ID                               with NEXT_PUBLIC_GA_ENABLED
  #     GEMINI_LIVE_API_KEY                                         secret, for the voice chat

  # ===== Feature switches =====
  # Every switch the code reads, all off. A test (scripts/config/feature-switches.test.ts)
  # checks that each new switch is added here as "false". Some switches need others on
  # too; the note says so. NEXT_PUBLIC_* switches are read in the browser, so they are
  # needed at BUILD as well.

