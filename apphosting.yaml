  - variable: INVITE_LINK_SIGNING_KEY
    secret: invite-link-signing-key
    availability:
      - RUNTIME
  # Engine move D1: a paused waitlist journey (or an archived launch) HOLDS each
  # person's next email instead of ending their sequence; new signups join a paused
  # journey and wait; turning it back on releases them. Off = the original
  # behaviour (the step is marked done and the person gets nothing more).
  # ENABLED on dev; OFF in prod until verified here (apphosting.prod.yaml).
  - variable: WAITLIST_JOURNEY_HOLD_ON_PAUSE
    value: "true"
    availability:
      - RUNTIME
  # Engine move D2: waitlist journeys on the lifecycle engine. WAITLIST_ENGINE_ENABLED
  # is its kill switch (off: everyone in a moved journey is held where they are,
  # never dropped; new signups still join and wait). WAITLIST_ENGINE_PILOT_TENANTS
  # lists the tenants whose launches may move (comma-separated ids, or "*").
  # Needs the waitlist_enrolments indexes (firestore.indexes.json) deployed first.
  # ENABLED on dev; OFF in prod until verified here (apphosting.prod.yaml).
  - variable: WAITLIST_ENGINE_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: WAITLIST_ENGINE_PILOT_TENANTS
    value: "*"
    availability:
      - RUNTIME
