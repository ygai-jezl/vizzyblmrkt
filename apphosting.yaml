  - variable: GITHUB_APP_CLIENT_ID
    value: Iv23lise0Uy9XrPjrb7Z
    availability:
      - RUNTIME
  - variable: GITHUB_APP_CLIENT_SECRET
    secret: github-app-client-secret
    availability:
      - RUNTIME
  - variable: GITHUB_APP_PRIVATE_KEY
